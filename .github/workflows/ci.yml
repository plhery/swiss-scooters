name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web and backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: npm run cf-typegen
      - run: npx opennextjs-cloudflare build

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run iOS tests
        run: >-
          xcodebuild test
          -project ios/ZurichScooters/ZurichScooters.xcodeproj
          -scheme ZurichScooters
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          -derivedDataPath "$RUNNER_TEMP/ZurichScootersDerivedData"
          CODE_SIGNING_ALLOWED=NO
