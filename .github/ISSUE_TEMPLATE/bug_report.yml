name: Bug report
description: Report a reproducible problem in Swiss Scooters
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include precise personal locations or credentials. Report security issues using SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Web browser
        - Installed PWA
        - Native iPhone app
        - API
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, or device version
    validations:
      required: true
